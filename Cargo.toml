[workspace]
resolver = "3"
members = ["core", "prime", "gateway", "miner"]

[workspace.package]
version = "0.1.20"
edition = "2024"
publish = false
license = "AGPL-3.0-or-later"

# One version of every dependency for both crates: the pool and the gateway are one release,
# and the header hash and share format are byte-coupled between them.
[workspace.dependencies]
base64 = "0.23"
bech32 = "0.12.0"
blake2 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
bytes = "1"
clap = { version = "4.6.6", features = ["derive"] }
dryoc = "1"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
hex = "0.4"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
minreq = { version = "3.0.0", features = ["https"] }
redb = "4.2.0"
serde = { version = "1", features = ["derive"] }
# preserve_order: the gateway rewrites its configuration file from the settings page and
# keeps the keys in the file's order.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0.20"
tiny_http = "0.12"
toml = "1.1.4"
